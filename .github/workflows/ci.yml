name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: crownline-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-and-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Ensure Graphviz is available
        timeout-minutes: 3
        run: |
          if ! command -v dot >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y graphviz
          fi
      - run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - run: make ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crownline-linux-preview
          path: dist/*.tar.gz*
          if-no-files-found: error
          retention-days: 14
